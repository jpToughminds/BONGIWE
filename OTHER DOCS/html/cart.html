<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cart</title>
    <link rel="stylesheet" href="/styles/cart.css">
</head>
<body>
    <div class="cart-container">
        <div class="subtotal">
            <div class="subtotalAmout">Subtotal K500</div>
            <button class="checkout">Proceed To Checkout <span>(5 Items) </span></button>
        </div>
       <div class="cart-itmes">
            <div class="item-container">
                <div class="item-details">
                    <div class="image">
                        <img src="/images/bongiwe/jewerlyWatch.jpg" alt="Golden hour">
                    </div>
                    <div class="item-description">
                        <small class="product-category">Jewelry</small>
                        <p class="product-class">Golden Hour</p></h3>
                        <div class="price"><h1>k26.00</h1></div>
                        <div class="Availability">in stock</div>
                    </div>
                </div>
                <div class="cart-details">
                <div class="quantity">
                    <div class="minus-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path fill="currentColor" d="M0 256c0-17.7 14.3-32 32-32l384 0c17.7 0 32 14.3 32 32s-14.3 32-32 32L32 288c-17.7 0-32-14.3-32-32z"/></svg>
                    </div>
                    <div class="counter">
                        2
                    </div>
                    <div class="add-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path fill="currentColor" d="M256 64c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 160-160 0c-17.7 0-32 14.3-32 32s14.3 32 32 32l160 0 0 160c0 17.7 14.3 32 32 32s32-14.3 32-32l0-160 160 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-160 0 0-160z"/></svg>
                    </div>
                </div>
                <button id="delete">delete</button>
                </div>
            </div>
        
        <div class="item-container">
            <div class="item-details">
                <div class="image">
                    <img src="/images/bongiwe/jewerlyWatch.jpg" alt="Golden hour">
                </div>
                <div class="item-description">
                    <small class="product-category">Jewelry</small>
                    <p class="product-class">Golden Hour</p></h3>
                    <div class="price"><h1>k26.00</h1></div>
                    <div class="Availability">in stock</div>
                </div>
            </div>

            <div class="cart-details">
                <div class="quantity">
                    <div class="minus-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path fill="currentColor" d="M0 256c0-17.7 14.3-32 32-32l384 0c17.7 0 32 14.3 32 32s-14.3 32-32 32L32 288c-17.7 0-32-14.3-32-32z"/></svg>
                    </div>
                    <div class="counter">
                        2
                    </div>
                    <div class="add-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path fill="currentColor" d="M256 64c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 160-160 0c-17.7 0-32 14.3-32 32s14.3 32 32 32l160 0 0 160c0 17.7 14.3 32 32 32s32-14.3 32-32l0-160 160 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-160 0 0-160z"/></svg>
                    </div>
                </div>
                <button id="delete">delete</button>
            </div>
        </div>
       </div>

           
    </div>

</body>
</html>
